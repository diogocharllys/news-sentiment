[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "news-sentiment"
version = "0.1.0"
description = "Agregador de notícias econômicas com análise de sentimento, NER e correlação com ativos"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Diogo Charllys F. Lopes", email = "diogocharlys95@gmail.com" },
]
# license = { text = "MIT" }  # TODO: escolher (MIT, Apache-2.0, etc.)

# Dependências de runtime — vazio por enquanto, adicionamos conforme o roadmap.
dependencies = [
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.49",
]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — suportado nativamente pelo uv.
# Grupo `dev` é instalado automaticamente por `uv sync`.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

# ---------------------------------------------------------------------------
# Hatchling — diz onde está o código com layout src/
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/news_sentiment"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (ordenação de imports)
    "B",    # flake8-bugbear (bugs comuns)
    "UP",   # pyupgrade (sintaxe moderna)
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy (type checker)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marca testes de integração (dependem de serviços externos)",
]
