# Pre-commit hooks
# Instalar:  uv run pre-commit install
# Rodar manualmente em tudo:  uv run pre-commit run --all-files
# Atualizar versões:  uv run pre-commit autoupdate

repos:
  # Hooks pequenos e baratos da própria pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: lint (com --fix) + format
  # A ordem importa: lint primeiro (pode reescrever código), format depois.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Mypy rodando dentro do ambiente do projeto (via uv run),
  # para enxergar o pacote news_sentiment e suas deps.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
